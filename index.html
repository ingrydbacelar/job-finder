<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vagas para Você</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="page__header">
      <h1 class="page__title">
        <span class="page__badge"><span class="page__badge-dot"></span>LOCAL · SEM CANDIDATURA AUTOMÁTICA</span>
        <span class="page__title-text">Vagas para <span class="text-accent">Você</span></span>
      </h1>
      <p class="page__subtitle">Envie seu currículo. Analisamos seu perfil e buscamos vagas compatíveis no Google — você decide onde se candidatar.</p>
    </header>

    <main class="panel" id="tela-upload">
      <label for="input-pdf" class="panel__label">Currículo</label>

      <label for="input-pdf" class="upload-box" id="upload-box">
        <span id="upload-label">📄 Enviar currículo PDF</span>
        <input type="file" id="input-pdf" accept="application/pdf" hidden>
      </label>

      <div class="panel__actions">
        <button id="btn-buscar" class="btn-primary" disabled>
          <span id="btn-buscar-label">ENCONTRAR VAGAS</span>
        </button>
      </div>

      <div id="error-box" class="error-box" hidden></div>
    </main>

    <main class="panel" id="tela-carregando" hidden>
      <div class="loading-wrap">
        <div class="spinner"></div>
        <p id="texto-carregando" class="loading-text">Analisando seu currículo e buscando vagas...</p>
      </div>
    </main>

    <section id="tela-resultados" class="results" hidden>
      <div class="results__header">
        <h2 class="results__title" id="titulo-resultados">Resultado</h2>
        <div class="results__header-right">
          <button id="btn-exportar" class="btn-secondary">
            <span>Baixar CSV</span>
          </button>
        </div>
      </div>

      <div id="lista-vagas" class="lista-vagas"></div>

      <button id="btn-nova-busca" class="btn-texto">← Enviar outro currículo</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
